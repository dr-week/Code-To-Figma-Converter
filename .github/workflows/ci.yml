name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.3.4 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix tests/spikes/openpencil --ignore-scripts --no-audit --no-fund
      - run: pnpm --filter @code-to-figma/browser exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm format:check
